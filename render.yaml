services:
  - type: web
    name: acme-salary-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run db:generate && npm run build --workspace @acme/api
    startCommand: npm run start --workspace @acme/api
    preDeployCommand: npm run db:migrate
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: acme-salary-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace @acme/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
